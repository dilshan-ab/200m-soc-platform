name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,connectors]"
      - name: Tests
        run: pytest -q
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Types (mypy)
        run: mypy app

  backend-postgres:
    # Production runs PostgreSQL; SQLite hides length limits, case-sensitive LIKE and column type drift.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine   # same as docker-compose.yml
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc
          POSTGRES_DB: soc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soc -d soc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOC_TEST_DATABASE_URL: postgresql+psycopg://soc:soc@localhost:5432/soc_test
      SOC_TEST_MIGRATIONS_URL: postgresql+psycopg://soc:soc@localhost:5432/soc_migrate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,connectors]"
      - name: Create the migrations database
        run: PGPASSWORD=soc psql -h localhost -U soc -d soc_test -c "CREATE DATABASE soc_migrate"
      - name: Tests and migrations on PostgreSQL
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint (eslint)
        run: npm run lint

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment recovery
        run: python3 -m unittest discover -s scripts/tests -v

name: Build and deploy

on:
  push:
    branches: [main]

# Keep image publication and server replacement in the same serialized run.
concurrency:
  group: soc-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_owner: ${{ steps.vars.outputs.image_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment recovery
        run: python3 -m unittest discover -s scripts/tests -v
      - id: vars
        run: echo "image_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_owner }}/soc-backend:latest
            ghcr.io/${{ steps.vars.outputs.image_owner }}/soc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_owner }}/soc-web:latest
            ghcr.io/${{ steps.vars.outputs.image_owner }}/soc-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy runtime files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml,deploy/"
          target: ${{ secrets.SERVER_APP_DIR }}
          overwrite: true
      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SERVER_APP_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
            bash deploy/restart-services.sh
            docker image prune -f
      - name: Verify backend health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR }}
            echo "--- Container status ---"
            docker compose ps
            echo ""
            echo "--- Waiting for backend health (up to 30s) ---"
            for i in $(seq 1 6); do
              if curl -sf http://127.0.0.1:8080/api/healthz >/dev/null 2>&1; then
                echo "Backend healthy after $((i * 5))s"
                exit 0
              fi
              sleep 5
            done
            echo "Backend NOT healthy after 30s — dumping logs:"
            echo "--- Backend logs (last 80 lines) ---"
            docker compose logs backend --tail 80 --no-color
            echo ""
            echo "--- Docker events (last 60s) ---"
            docker events --since 60s --until 0s --filter container=soc-backend-1 2>/dev/null || true
            exit 1
